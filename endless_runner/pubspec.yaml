name: runner_flutter
description: Endless runner 2.5D - Trabajo 2 Laboratorio de Apps Moviles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.12.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  video_player: ^2.9.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/character/kenney_platformerCharacters/adventurer_vector.svg
    - assets/images/character/player_atlas.png
    - assets/images/in_zombie_run_menu.png
    - assets/music/
    - assets/video/

  # Fuente pixel (SIL Open Font License, ver assets/fonts/OFL.txt) para los
  # menús de 8 bits.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
